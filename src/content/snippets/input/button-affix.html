<div>
	<div role="group" data-input-group>
		<button type="button" aria-label="Decrease quantity" data-step="-1">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				width="24"
				height="24"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				class="lucide lucide-minus"
				aria-hidden="true"
			>
				<path d="M5 12h14" />
			</svg>
		</button>
		<input type="number" value="1234" aria-label="Quantity" />
		<button type="button" aria-label="Increase quantity" data-step="1">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				width="24"
				height="24"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				class="lucide lucide-plus"
				aria-hidden="true"
			>
				<path d="M5 12h14" />
				<path d="M12 5v14" />
			</svg>
		</button>
	</div>

	<div role="group" data-input-group>
		<input type="password" value="knife-holder" aria-label="Password" />
		<button type="button" aria-label="Show password" data-reveal>
			<svg
				xmlns="http://www.w3.org/2000/svg"
				width="24"
				height="24"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				class="lucide lucide-eye"
				aria-hidden="true"
			>
				<path
					d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
				/>
				<circle cx="12" cy="12" r="3" />
			</svg>
			<svg
				xmlns="http://www.w3.org/2000/svg"
				width="24"
				height="24"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				class="lucide lucide-eye-closed"
				aria-hidden="true"
				hidden
			>
				<path d="m15 18-.722-3.25" />
				<path d="M2 8a10.645 10.645 0 0 0 20 0" />
				<path d="m20 15-1.726-2.05" />
				<path d="m4 15 1.726-2.05" />
				<path d="m9 18 .722-3.25" />
			</svg>
		</button>
	</div>

	<div role="group" data-input-group>
		<input type="text" value="knives" placeholder="Add a tag" aria-label="Tag" />
		<button type="button" aria-label="Clear field" data-clear>
			<svg
				xmlns="http://www.w3.org/2000/svg"
				width="24"
				height="24"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				class="lucide lucide-delete"
				aria-hidden="true"
			>
				<path
					d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"
				/>
				<path d="m12 9 6 6" />
				<path d="m18 9-6 6" />
			</svg>
		</button>
	</div>

	<div role="group" data-input-group>
		<input type="text" maxlength="50" placeholder="Short bio" aria-label="Short bio" />
		<span data-count aria-hidden="true">0 / 50</span>
	</div>
</div>
