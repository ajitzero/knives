<div role="group" data-input-group>
	<button type="button" aria-label="Decrease quantity" data-step="-1">
		<svg
			xmlns="http://www.w3.org/2000/svg"
			width="24"
			height="24"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
			class="lucide lucide-minus"
			aria-hidden="true"
		>
			<path d="M5 12h14" />
		</svg>
	</button>
	<input type="number" value="1234" aria-label="Quantity" />
	<button type="button" aria-label="Increase quantity" data-step="1">
		<svg
			xmlns="http://www.w3.org/2000/svg"
			width="24"
			height="24"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
			class="lucide lucide-plus"
			aria-hidden="true"
		>
			<path d="M5 12h14" />
			<path d="M12 5v14" />
		</svg>
	</button>
</div>
